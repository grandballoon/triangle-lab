<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Triangle Lab · Geometry</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='16,5 28,27 4,27' fill='none' stroke='%2338d9a9' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { min-height: 100%; }
      body {
        background:
          radial-gradient(1200px 600px at 50% -10%, #12202a 0%, #0b0f14 60%);
        color: #e9f0f7;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        min-height: 100vh; display: flex; justify-content: center;
        padding: 64px 24px;
      }
      .page {
        width: 100%; max-width: 1340px;
        display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px;
        align-items: start;
      }
      .wrap { width: 100%; max-width: 1080px; }

      /* The margin: each chapter's main results, by name. Sticky beside the
         menu, scrolling on its own when it outgrows the window; every level
         is a <details>, so it folds away when it gets long. */
      #axioms {
        position: sticky; top: 24px; max-height: calc(100vh - 48px);
        overflow-y: auto; overscroll-behavior: contain;
        padding-right: 6px; font-size: 13px; line-height: 1.45;
        scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.12) transparent;
      }
      #axioms summary {
        cursor: pointer; list-style: none; user-select: none;
        display: flex; align-items: center; gap: 6px;
      }
      #axioms summary::-webkit-details-marker { display: none; }
      #axioms summary::before {
        content: ""; flex: none; width: 5px; height: 5px;
        border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
        transform: rotate(-45deg); transition: transform 0.15s ease; opacity: 0.6;
      }
      #axioms details[open] > summary::before { transform: rotate(45deg); }
      #axioms > details > summary {
        text-transform: uppercase; letter-spacing: 0.18em; font-size: 12px;
        font-weight: 600; color: #38d9a9; margin-bottom: 10px;
      }
      #axioms .group { margin-top: 2px; }
      #axioms .group > summary {
        font-weight: 650; color: #e9f0f7; padding: 5px 0;
      }
      #axioms .group > summary:hover { color: #38d9a9; }
      #axioms ul {
        list-style: none; margin: 2px 0 8px 11px; padding-left: 10px;
        border-left: 1px solid rgba(255, 255, 255, 0.08);
      }
      #axioms li { color: rgba(233, 240, 247, 0.55); padding: 2px 0; }

      @media (max-width: 960px) {
        .page { grid-template-columns: minmax(0, 1fr); gap: 32px; }
        #axioms { position: static; max-height: none; overflow: visible; order: 1; }
        .wrap { order: 0; }
      }
      @media (max-width: 600px) {
        body { padding: 32px 16px; }
        .chapter { margin-top: 36px; }
        .card { padding: 16px; gap: 14px; }
      }
      .eyebrow {
        text-transform: uppercase; letter-spacing: 0.18em; font-size: 13px;
        font-weight: 600; color: #38d9a9; margin-bottom: 10px;
      }
      h1 { font-size: clamp(30px, 6vw, 46px); font-weight: 800; letter-spacing: -0.02em; }
      .sub { color: rgba(233, 240, 247, 0.6); margin-top: 10px; font-size: 17px; }
      .chapter { margin-top: 48px; }
      .chapter h2 { font-size: 24px; font-weight: 750; letter-spacing: -0.01em; }
      .chapter .blurb { color: rgba(233, 240, 247, 0.55); margin-top: 4px; font-size: 15px; }
      .grid {
        margin-top: 18px; display: grid; gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }
      .card {
        display: flex; gap: 16px; align-items: center;
        padding: 20px 22px; border-radius: 16px; text-decoration: none;
        color: inherit; background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      }
      .card:hover {
        transform: translateY(-3px);
        background: rgba(255, 255, 255, 0.055);
        border-color: var(--accent);
      }
      .icon {
        flex: none; width: 52px; height: 52px; border-radius: 12px;
        display: grid; place-items: center;
        background: color-mix(in srgb, var(--accent) 16%, transparent);
      }
      .icon svg { width: 30px; height: 30px; color: var(--accent); }
      .meta { display: flex; flex-direction: column; gap: 2px; }
      .meta .part {
        font-size: 12px; font-weight: 600; letter-spacing: 0.08em;
        text-transform: uppercase; color: var(--accent);
      }
      .meta .name { font-size: 19px; font-weight: 700; margin-top: 2px; }
      .meta .desc { font-size: 14px; color: rgba(233, 240, 247, 0.55); margin-top: 3px; }
      .foot { margin-top: 48px; font-size: 13px; color: rgba(233, 240, 247, 0.35); }
    </style>
  </head>
  <body>
    <div class="page">
      <nav id="axioms" aria-label="Axioms by chapter"></nav>
      <div class="wrap">
        <div class="eyebrow">Triangle Lab</div>
        <h1>Geometry</h1>
        <p class="sub">Pinch a point in front of your camera and feel the geometry change under your hand.</p>

        <div id="menu"></div>

        <p class="foot">Hand tracking needs a camera; every lesson also works with a mouse or a finger.</p>
      </div>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
