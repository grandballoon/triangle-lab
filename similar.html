<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Triangles · Similar Triangles</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpolygon points='4,26 14,26 14,19' fill='none' stroke='%232dd4bf' stroke-width='2.5' stroke-linejoin='round'/%3E%3Cpolygon points='4,26 28,26 28,9' fill='none' stroke='%232dd4bf' stroke-width='1.5' stroke-linejoin='round' stroke-dasharray='3 3'/%3E%3C/svg%3E"
    />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0f14; }
      #cam {
        position: fixed; inset: 0; width: 100%; height: 100%;
        object-fit: cover; transform: scaleX(-1);
        filter: saturate(0.85) brightness(0.7);
      }
      #veil { position: fixed; inset: 0; background: rgba(6, 10, 16, 0.45); }
      #stage {
        /* Clear of the curriculum rail on the left, the step column on the
           right and any formula band below (page.ts). A canvas keeps its
           300x150 default unless sized explicitly; insets alone do not
           stretch it. */
        position: fixed; top: 0; left: var(--rail-inset, 0px);
        width: calc(100% - var(--rail-inset, 0px) - var(--steps-inset, 0px));
        height: calc(100% - var(--formulas-inset, 0px));
        touch-action: none; cursor: grab;
      }
      #stage.grabbing { cursor: grabbing; }
    </style>
  </head>
  <body>
    <video id="cam" playsinline muted autoplay></video>
    <div id="veil"></div>
    <canvas id="stage"></canvas>
    <script type="module" src="/src/similar.ts"></script>
    <script type="module" src="/src/page.ts"></script>
  </body>
</html>
