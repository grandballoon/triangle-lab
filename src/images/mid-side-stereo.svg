<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#131a23"/>
  <g stroke="#0b0f14" stroke-width="5" stroke-linejoin="round"><rect x="40" y="34" width="84" height="110" rx="10" fill="#5a6878"/><circle cx="82" cy="89" r="34" fill="#2a3440"/><rect x="40" y="164" width="84" height="110" rx="10" fill="#5a6878"/><circle cx="82" cy="219" r="34" fill="#2a3440"/></g>
  <text x="82" y="101" font-family="system-ui, sans-serif" font-weight="700" font-size="34" text-anchor="middle" fill="#f3ead8">L</text>
  <text x="82" y="231" font-family="system-ui, sans-serif" font-weight="700" font-size="34" text-anchor="middle" fill="#f3ead8">R</text>
  <g stroke="#8fa3b8" stroke-width="4" fill="none" stroke-linecap="round"><path d="M130 89 L236 89 M130 89 L236 205 M130 219 L236 103 M130 219 L236 219"/></g>
  <g fill="#8fa3b8"><path d="M250 89 L236 81 L236 97 Z M250 219 L236 211 L236 227 Z"/><path d="M247 217 L232 212 L242 201 Z M247 91 L242 107 L232 98 Z"/></g>
  <g stroke="#0b0f14" stroke-width="5" stroke-linejoin="round"><rect x="254" y="50" width="196" height="80" rx="12" fill="#5fb0e8"/><rect x="254" y="180" width="196" height="80" rx="12" fill="#f2c14e"/></g>
  <g font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle" fill="#0b0f14"><text x="352" y="82" font-size="22">mid M</text><text x="352" y="116" font-size="28">(L + R)/2</text><text x="352" y="212" font-size="22">side S</text><text x="352" y="246" font-size="28">(L − R)/2</text></g>
  <g font-family="system-ui, sans-serif" font-weight="700" font-size="26" text-anchor="middle" fill="#f3ead8"><text x="545" y="100">L = M + S</text><text x="545" y="230">R = M − S</text></g>
  <text x="320" y="326" font-family="system-ui, sans-serif" font-weight="700" font-size="28" text-anchor="middle" fill="#8fa3b8">swap L and R: <tspan fill="#5fb0e8">M stays</tspan>, <tspan fill="#f2c14e">S → −S</tspan></text>
</svg>
