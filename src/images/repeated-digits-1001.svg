<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#131a23"/>
  <text x="320" y="112" font-family="system-ui, sans-serif" font-weight="700" font-size="92" text-anchor="middle" fill="#f3ead8">123<tspan fill="#f2c14e">123</tspan></text>
  <text x="320" y="168" font-family="system-ui, sans-serif" font-weight="700" font-size="30" text-anchor="middle" fill="#8fa3b8">= 123 000 + <tspan fill="#f2c14e">123</tspan></text>
  <text x="320" y="232" font-family="system-ui, sans-serif" font-weight="700" font-size="40" text-anchor="middle" fill="#f3ead8">= 123 × 1001</text>
  <text x="320" y="306" font-family="system-ui, sans-serif" font-weight="700" font-size="36" text-anchor="middle" fill="#f3ead8">1001 = 10³ + 1 = <tspan fill="#f2c14e">7</tspan> × <tspan fill="#f2c14e">11</tspan> × <tspan fill="#f2c14e">13</tspan></text>
</svg>
