  <text x="475" y="272" font-family="system-ui, sans-serif" font-weight="700" font-size="20" text-anchor="middle" fill="#8fa3b8">= rock ∗ scissors = <tspan fill="#f2c14e">rock</tspan></text>
  <text x="475" y="330" font-family="system-ui, sans-serif" font-weight="700" font-size="20" text-anchor="middle" fill="#8fa3b8">commutative, not associative</text>
