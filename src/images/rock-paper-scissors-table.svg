  <text x="475" y="120" font-family="system-ui, sans-serif" font-weight="700" font-size="20" text-anchor="middle" fill="#eef4fb">(rock ∗ paper) ∗ scissors</text>
  <text x="475" y="156" font-family="system-ui, sans-serif" font-weight="700" font-size="20" text-anchor="middle" fill="#8fa3b8">= paper ∗ scissors = scissors</text>
